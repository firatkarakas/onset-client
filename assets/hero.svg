<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-labelledby="t d">
  <title id="t">Onset</title>
  <desc id="d">Onset banner: self-hosted voice, text and screen sharing for Windows, with an illustration of the desktop strip in a call and the top of its panel.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="-10%" r="95%">
      <stop offset="0" stop-color="#16161b"/>
      <stop offset="0.62" stop-color="#08080a"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#08080a" stop-opacity="0"/>
      <stop offset="1" stop-color="#08080a"/>
    </linearGradient>
    <clipPath id="card"><rect width="1280" height="420" rx="24"/></clipPath>
    <symbol id="i-mic" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></g></symbol>
    <symbol id="i-hp" viewBox="0 0 24 24"><path d="M4 15v-3a8 8 0 0 1 16 0v3" fill="none" stroke="currentColor" stroke-width="2"/><rect x="3" y="13.5" width="5" height="7" rx="2" fill="currentColor"/><rect x="16" y="13.5" width="5" height="7" rx="2" fill="currentColor"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 13.5V8.5M9.5 11 12 8.5l2.5 2.5"/></g></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round"><circle cx="12" cy="12" r="6.3" stroke-width="2"/><circle cx="12" cy="12" r="2.4" stroke-width="2"/><path stroke-width="3" d="M12 2.8v1.9M12 19.3v1.9M2.8 12h1.9M19.3 12h1.9M5.5 5.5l1.3 1.3M17.2 17.2l1.3 1.3M5.5 18.5l1.3-1.3M17.2 6.8l1.3-1.3"/></g></symbol>
    <symbol id="i-dns" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="16" height="6.5" rx="1.5"/></g><circle cx="8" cy="7.25" r="1.2" fill="currentColor"/><circle cx="8" cy="16.75" r="1.2" fill="currentColor"/></symbol>
    <symbol id="i-voice" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="9" r="3.5"/><path d="M2.5 20c0-3.3 2.9-5.5 6.5-5.5s6.5 2.2 6.5 5.5M17 6.5a4.5 4.5 0 0 1 0 6M19.8 4a8 8 0 0 1 0 11"/></g></symbol>
    <symbol id="i-forum" viewBox="0 0 24 24"><path d="M4 5h11v8.5H8.5L4 17zM18 9h2v10.5L17 17H9v-1.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></g></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="10" r="3"/><path d="M6.3 18.3a7 7 0 0 1 11.4 0"/></g></symbol>
    <symbol id="i-min" viewBox="0 0 24 24"><path d="M6 12h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  </defs>
  <style>
    .t{font-family:Manrope,'Segoe UI',system-ui,sans-serif}
    .m{font-family:'JetBrains Mono',Consolas,monospace}
  </style>

  <g clip-path="url(#card)">
    <rect width="1280" height="420" fill="url(#bg)"/>

    <!-- Wordmark and pitch -->
    <rect x="64" y="72" width="12" height="12" rx="3" fill="#46c07a"/>
    <text x="86" y="83.5" class="t" font-size="13" font-weight="800" letter-spacing="1.6" fill="#a0a0a8">DESKTOP CLIENT · WINDOWS</text>
    <text x="62" y="148" class="t" font-size="58" font-weight="800" letter-spacing="-1.6" fill="#ededf0">Onset</text>
    <text x="64" y="188" class="t" font-size="21" font-weight="600" fill="#a0a0a8">Self-hosted voice, text and screen sharing.</text>
    <text x="64" y="220" class="t" font-size="15.5" fill="#82828b">Your server, your people, your data. Nothing is hosted by the developers.</text>

    <!-- Facts -->
    <g class="t" font-size="13.5" font-weight="600" fill="#c8c8cf">
      <rect x="860.5" y="72.5" width="355" height="35" rx="17.5" fill="#131316" stroke="#ffffff" stroke-opacity="0.08"/>
      <circle cx="882" cy="90" r="4" fill="#46c07a"/>
      <text x="896" y="95">Opus voice over encrypted UDP</text>
      <rect x="860.5" y="118.5" width="355" height="35" rx="17.5" fill="#131316" stroke="#ffffff" stroke-opacity="0.08"/>
      <circle cx="882" cy="136" r="4" fill="#46c07a"/>
      <text x="896" y="141">Server identity pinned on first connect</text>
      <rect x="860.5" y="164.5" width="355" height="35" rx="17.5" fill="#131316" stroke="#ffffff" stroke-opacity="0.08"/>
      <circle cx="882" cy="182" r="4" fill="#46c07a"/>
      <text x="896" y="187">Windows 10 and 11 · x64</text>
    </g>

    <!-- The strip and the top of its panel, scaled from the full illustration -->
    <g transform="translate(74 256) scale(0.9)">
      <rect x="40.5" y="40.5" width="1179" height="61" rx="30.5" fill="#1a1a1d" stroke="#ffffff" stroke-opacity="0.16"/>
      <g fill="#ededf0" fill-opacity="0.4">
        <circle cx="55.5" cy="65" r="1.5"/><circle cx="61.5" cy="65" r="1.5"/>
        <circle cx="55.5" cy="71" r="1.5"/><circle cx="61.5" cy="71" r="1.5"/>
        <circle cx="55.5" cy="77" r="1.5"/><circle cx="61.5" cy="77" r="1.5"/>
      </g>
      <use href="#i-dns" x="88" y="60" width="22" height="22" color="#ededf0"/>
      <circle cx="108.5" cy="80.5" r="3.5" fill="#46c07a" stroke="#1a1a1d" stroke-width="2"/>
      <rect x="127" y="60" width="1" height="22" fill="#ffffff" fill-opacity="0.16"/>
      <rect x="465" y="51" width="330" height="40" rx="20" fill="#262629"/>
      <rect x="465" y="51" width="249" height="40" rx="20" fill="#2c2c30"/>
      <use href="#i-voice" x="479" y="61.5" width="19" height="19" color="#46c07a"/>
      <text x="508" y="76" class="t" font-size="13.5" font-weight="600" fill="#ededf0">Maya is speaking</text>
      <text x="678" y="75" class="m" font-size="11" fill="#82828b" text-anchor="end">12:47</text>
      <g fill="#46c07a">
        <rect x="688" y="68" width="2" height="6" rx="1"/>
        <rect x="692" y="64" width="2" height="14" rx="1"/>
        <rect x="696" y="66" width="2" height="10" rx="1"/>
        <rect x="700" y="63" width="2" height="16" rx="1"/>
      </g>
      <rect x="718" y="61" width="1" height="20" fill="#ffffff" fill-opacity="0.16"/>
      <use href="#i-mic" x="731.5" y="61.5" width="19" height="19" color="#c8c8cf"/>
      <use href="#i-hp" x="765.5" y="61.5" width="19" height="19" color="#c8c8cf"/>
      <rect x="469" y="44" width="17" height="17" rx="8.5" fill="#e5484d" stroke="#1a1a1d" stroke-width="2"/>
      <text x="477.5" y="56.5" class="t" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">3</text>
      <use href="#i-gear" x="1079.5" y="60.5" width="21" height="21" color="#c8c8cf"/>
      <rect x="1117" y="59" width="1" height="24" fill="#ffffff" fill-opacity="0.16"/>
      <use href="#i-min" x="1134.5" y="60.5" width="21" height="21" color="#c8c8cf"/>
      <use href="#i-close" x="1178.5" y="60.5" width="21" height="21" color="#c8c8cf"/>

      <!-- panel top -->
      <rect x="40.5" y="112.5" width="1179" height="160" rx="19.5" fill="#131315" stroke="#ffffff" stroke-opacity="0.16"/>
      <rect x="52" y="122" width="109" height="38" rx="10" fill="#262629"/>
      <use href="#i-forum" x="65" y="131.5" width="19" height="19" color="#ededf0"/>
      <text x="92" y="145.5" class="t" font-size="13" font-weight="600" fill="#ededf0">Chat</text>
      <rect x="130" y="132" width="18" height="18" rx="9" fill="#e5484d"/>
      <text x="139" y="145" class="t" font-size="10.5" font-weight="800" fill="#ffffff" text-anchor="middle">3</text>
      <use href="#i-share" x="178" y="131.5" width="19" height="19" color="#8b8b92"/>
      <text x="205" y="145.5" class="t" font-size="13" font-weight="600" fill="#8b8b92">Screen</text>
      <use href="#i-search" x="280" y="131.5" width="19" height="19" color="#8b8b92"/>
      <text x="307" y="145.5" class="t" font-size="13" font-weight="600" fill="#8b8b92">Search</text>
      <use href="#i-user" x="383" y="131.5" width="19" height="19" color="#8b8b92"/>
      <text x="410" y="145.5" class="t" font-size="13" font-weight="600" fill="#8b8b92">Profile</text>
      <use href="#i-gear" x="484" y="131.5" width="19" height="19" color="#8b8b92"/>
      <text x="511" y="145.5" class="t" font-size="13" font-weight="600" fill="#8b8b92">Settings</text>
      <circle cx="930" cy="141" r="3.5" fill="#46c07a"/>
      <text x="1166" y="145" class="m" font-size="11" fill="#82828b" text-anchor="end">ping 18 ms · buffer 40 ms · 0.0% loss</text>
      <use href="#i-close" x="1184" y="132" width="18" height="18" color="#c8c8cf"/>
    </g>
    <rect y="370" width="1280" height="50" fill="url(#fade)"/>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="419" rx="23.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>

    <text x="92" y="409.5" class="t" font-size="9.5" font-weight="800" fill="#ededf0" text-anchor="middle">M</text>
    <text x="110" y="410.5" class="t" font-size="12.5" fill="#ededf0">Maya</text>
    <circle cx="92" cy="434" r="10" fill="#262629"/>
    <text x="92" y="437.5" class="t" font-size="9.5" font-weight="800" fill="#a0a0a8" text-anchor="middle">D</text>
    <text x="110" y="438.5" class="t" font-size="12.5" fill="#8b8b92">Deniz</text>
    <circle cx="92" cy="462" r="10" fill="#262629"/>
    <text x="92" y="465.5" class="t" font-size="9.5" font-weight="800" fill="#a0a0a8" text-anchor="middle">A</text>
    <text x="110" y="466.5" class="t" font-size="12.5" fill="#8b8b92">Alex</text>
    <use href="#i-vol" x="60" y="489" width="18" height="18" color="#8b8b92" opacity="0.7"/>
    <text x="87" y="503" class="t" font-size="14" font-weight="500" fill="#8b8b92">Quiet room</text>

    <text x="60" y="546" class="t" font-size="10.5" font-weight="800" letter-spacing="1.05" fill="#82828b">DIRECT MESSAGES</text>
    <use href="#i-at" x="60" y="563" width="18" height="18" color="#8b8b92" opacity="0.7"/>
    <text x="87" y="577" class="t" font-size="14" font-weight="500" fill="#8b8b92">Deniz</text>
    <use href="#i-plus" x="60" y="605" width="18" height="18" color="#8b8b92"/>
    <text x="87" y="619" class="t" font-size="13.5" font-weight="600" fill="#8b8b92">New room</text>

    <!-- head row -->
    <use href="#i-hash" x="300" y="188" width="18" height="18" color="#ededf0" opacity="0.7"/>
    <text x="325" y="202" class="t" font-size="15" font-weight="700" fill="#ededf0">general</text>
    <text x="396" y="202" class="t" font-size="12.5" fill="#82828b">Persistent room · history is kept on the server</text>
    <rect x="1120.5" y="180.5" width="79" height="33" rx="9" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>
    <use href="#i-search" x="1132" y="188.5" width="17" height="17" color="#8b8b92"/>
    <text x="1156" y="201" class="m" font-size="10.5" fill="#82828b">Ctrl K</text>
    <rect x="280" y="224" width="940" height="1" fill="#ffffff" fill-opacity="0.07"/>

    <!-- messages -->
    <circle cx="317" cy="263" r="17" fill="#262629"/>
    <text x="317" y="268" class="t" font-size="13" font-weight="800" fill="#a0a0a8" text-anchor="middle">D</text>
    <text x="346" y="258" class="t" font-size="14" font-weight="700" fill="#ededf0">Deniz</text>
    <text x="394" y="258" class="m" font-size="11" fill="#82828b">21:04</text>
    <text x="346" y="280" class="t" font-size="14" fill="#c8c8cf">The server is on 1.0 now. Paste the invite from the control panel to connect.</text>

    <circle cx="317" cy="323" r="17" fill="#262629"/>
    <text x="317" y="328" class="t" font-size="13" font-weight="800" fill="#a0a0a8" text-anchor="middle">M</text>
    <text x="346" y="318" class="t" font-size="14" font-weight="700" fill="#ededf0">Maya</text>
    <text x="388" y="318" class="m" font-size="11" fill="#82828b">21:06</text>
    <text x="346" y="340" class="t" font-size="14" fill="#c8c8cf">In. Voice sounds clean on my side.</text>

    <rect x="292" y="360" width="916" height="62" rx="10" fill="#46c07a" fill-opacity="0.08"/>
    <rect x="292" y="360" width="2" height="62" fill="#46c07a"/>
    <circle cx="317" cy="383" r="17" fill="#262629"/>
    <text x="317" y="388" class="t" font-size="13" font-weight="800" fill="#a0a0a8" text-anchor="middle">D</text>
    <text x="346" y="378" class="t" font-size="14" font-weight="700" fill="#ededf0">Deniz</text>
    <text x="394" y="378" class="m" font-size="11" fill="#82828b">21:07</text>
    <text x="346" y="400" class="t" font-size="14" fill="#c8c8cf"><tspan fill="#7fe0a6" font-weight="600">@alex</tspan> can you share the build window?</text>

    <circle cx="317" cy="455" r="17" fill="#262629"/>
    <text x="317" y="460" class="t" font-size="13" font-weight="800" fill="#a0a0a8" text-anchor="middle">M</text>
    <text x="346" y="450" class="t" font-size="14" font-weight="700" fill="#ededf0">Maya</text>
    <text x="388" y="450" class="m" font-size="11" fill="#82828b">21:09</text>
    <text x="346" y="472" class="t" font-size="14" fill="#c8c8cf">Notes from today:</text>

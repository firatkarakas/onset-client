      <stop offset="0" stop-color="#131317"/>
      <stop offset="0.6" stop-color="#08080a"/>
    </radialGradient>
    <clipPath id="pc"><rect x="40" y="112" width="1180" height="540" rx="20"/></clipPath>
    <symbol id="i-mic" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></g></symbol>
    <symbol id="i-hp" viewBox="0 0 24 24"><path d="M4 15v-3a8 8 0 0 1 16 0v3" fill="none" stroke="currentColor" stroke-width="2"/><rect x="3" y="13.5" width="5" height="7" rx="2" fill="currentColor"/><rect x="16" y="13.5" width="5" height="7" rx="2" fill="currentColor"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 13.5V8.5M9.5 11 12 8.5l2.5 2.5"/></g></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 1.5h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></g></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><g fill="currentColor"><circle cx="6" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="18" cy="12" r="1.9"/></g></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round"><circle cx="12" cy="12" r="6.3" stroke-width="2"/><circle cx="12" cy="12" r="2.4" stroke-width="2"/><path stroke-width="3" d="M12 2.8v1.9M12 19.3v1.9M2.8 12h1.9M19.3 12h1.9M5.5 5.5l1.3 1.3M17.2 17.2l1.3 1.3M5.5 18.5l1.3-1.3M17.2 6.8l1.3-1.3"/></g></symbol>
    <symbol id="i-dns" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="16" height="6.5" rx="1.5"/></g><circle cx="8" cy="7.25" r="1.2" fill="currentColor"/><circle cx="8" cy="16.75" r="1.2" fill="currentColor"/></symbol>
    <symbol id="i-voice" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="9" r="3.5"/><path d="M2.5 20c0-3.3 2.9-5.5 6.5-5.5s6.5 2.2 6.5 5.5M17 6.5a4.5 4.5 0 0 1 0 6M19.8 4a8 8 0 0 1 0 11"/></g></symbol>
    <symbol id="i-forum" viewBox="0 0 24 24"><path d="M4 5h11v8.5H8.5L4 17zM18 9h2v10.5L17 17H9v-1.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></g></symbol>
    <symbol id="i-tune" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h8M17 7h3M4 17h3M12 17h8"/><circle cx="14.5" cy="7" r="2.5"/><circle cx="9.5" cy="17" r="2.5"/></g></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="10" r="3"/><path d="M6.3 18.3a7 7 0 0 1 11.4 0"/></g></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-hash" viewBox="0 0 24 24"><path d="M10 4 8 20M16 4l-2 16M4.5 9h15M4 15h15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-vol" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z" fill="currentColor"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-at" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3.5"/><path d="M15.5 12v1.5a2.5 2.5 0 0 0 5 0V12a8.5 8.5 0 1 0-3.5 6.9"/></g></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-clip" viewBox="0 0 24 24"><path d="M20 11.5l-7.8 7.8a5 5 0 0 1-7-7l8.5-8.5a3.3 3.3 0 0 1 4.7 4.7l-8.3 8.3a1.7 1.7 0 0 1-2.4-2.4L15 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M7 3h7l5 5v13H7zM14 3v5h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4.5v11M7 10.5l5 5 5-5M6 20h12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </defs>
  <style>
    .t{font-family:Manrope,'Segoe UI',system-ui,sans-serif}
    .m{font-family:'JetBrains Mono',Consolas,monospace}
  </style>

  <!-- Desktop behind the object -->
  <rect x="0.5" y="0.5" width="1259" height="699" rx="24" fill="url(#bg)" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- The strip (free placement: full pill), 1180 px wide while the panel is open -->
  <rect x="40.5" y="40.5" width="1179" height="61" rx="30.5" fill="#1a1a1d" stroke="#ffffff" stroke-opacity="0.16"/>
  <!-- grip -->
  <g fill="#ededf0" fill-opacity="0.4">
    <circle cx="55.5" cy="65" r="1.5"/><circle cx="61.5" cy="65" r="1.5"/>
    <circle cx="55.5" cy="71" r="1.5"/><circle cx="61.5" cy="71" r="1.5"/>
    <circle cx="55.5" cy="77" r="1.5"/><circle cx="61.5" cy="77" r="1.5"/>
  </g>
  <!-- server button with connection dot -->
  <use href="#i-dns" x="88" y="60" width="22" height="22" color="#ededf0"/>
  <circle cx="108.5" cy="80.5" r="3.5" fill="#46c07a" stroke="#1a1a1d" stroke-width="2"/>
  <rect x="127" y="60" width="1" height="22" fill="#ffffff" fill-opacity="0.16"/>
  <!-- server address -->
  <text x="140" y="76" class="t" font-size="14.5" font-weight="500" fill="#a0a0a8">203.0.113.42:8080</text>
  <!-- ping readout -->
  <rect x="288" y="62" width="46" height="18" rx="9" fill="#232327"/>
  <text x="311" y="75" class="m" font-size="10.5" fill="#82828b" text-anchor="middle">18 ms</text>
  <!-- call pill -->
  <rect x="482" y="51" width="307" height="40" rx="20" fill="#262629"/>
  <use href="#i-voice" x="496" y="61.5" width="19" height="19" color="#46c07a"/>
  <text x="525" y="76" class="t" font-size="13.5" font-weight="600" fill="#ededf0">Maya is speaking</text>
  <text x="653" y="75" class="m" font-size="11" fill="#82828b">12:47</text>
  <g fill="#46c07a">
    <rect x="696" y="68" width="2" height="6" rx="1"/>
    <rect x="700" y="64" width="2" height="14" rx="1"/>
    <rect x="704" y="66" width="2" height="10" rx="1"/>
    <rect x="708" y="63" width="2" height="16" rx="1"/>
  </g>
  <rect x="720" y="56" width="64" height="30" rx="15" fill="#ededf0"/>
  <text x="752" y="75.5" class="t" font-size="12.5" font-weight="700" fill="#08080a" text-anchor="middle">Leave</text>
  <!-- controls -->
  <use href="#i-mic" x="947.5" y="60.5" width="21" height="21" color="#c8c8cf"/>
  <use href="#i-hp" x="991.5" y="60.5" width="21" height="21" color="#c8c8cf"/>
  <use href="#i-share" x="1035.5" y="60.5" width="21" height="21" color="#c8c8cf"/>
  <use href="#i-bell" x="1079.5" y="60.5" width="21" height="21" color="#c8c8cf"/>
  <rect x="1090" y="55" width="17" height="17" rx="8.5" fill="#e5484d" stroke="#1a1a1d" stroke-width="2"/>
  <text x="1098.5" y="67.5" class="t" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">3</text>
  <use href="#i-more" x="1123.5" y="60.5" width="21" height="21" color="#c8c8cf"/>
  <rect x="1161" y="59" width="1" height="24" fill="#ffffff" fill-opacity="0.16"/>
  <use href="#i-gear" x="1178.5" y="60.5" width="21" height="21" color="#c8c8cf"/>

  <!-- The panel: a second object, 10 px below the strip -->
  <rect x="40" y="112" width="1180" height="540" rx="20" fill="#0f0f11"/>
  <g clip-path="url(#pc)">
    <!-- tab bar -->
    <rect x="40" y="112" width="1180" height="58" fill="#131315"/>
    <rect x="40" y="170" width="1180" height="1" fill="#ffffff" fill-opacity="0.07"/>
    <rect x="52" y="122" width="109" height="38" rx="10" fill="#262629"/>
    <use href="#i-forum" x="65" y="131.5" width="19" height="19" color="#ededf0"/>
    <text x="92" y="145.5" class="t" font-size="13" font-weight="600" fill="#ededf0">Chat</text>
    <rect x="130" y="132" width="18" height="18" rx="9" fill="#e5484d"/>
    <text x="139" y="145" class="t" font-size="10.5" font-weight="800" fill="#ffffff" text-anchor="middle">3</text>
    <use href="#i-share" x="178" y="131.5" width="19" height="19" color="#8b8b92"/>
    <text x="205" y="145.5" class="t" font-size="13" font-weight="600" fill="#8b8b92">Screen</text>
    <use href="#i-search" x="280" y="131.5" width="19" height="19" color="#8b8b92"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 700" width="1260" height="700" role="img" aria-labelledby="t d">
  <title id="t">Onset strip with the panel open</title>
  <desc id="d">Illustration of the Onset desktop strip: grip, server button, server address, ping readout, call pill showing who is speaking, and microphone, headphones, screen share, notifications, more and settings controls. Below it the panel is open on the Chat tab, with the Screen, Search, Audio and Video, Profile and Settings tabs, a live line with ping, buffer and loss, the rooms column and a text room.</desc>
  <defs>

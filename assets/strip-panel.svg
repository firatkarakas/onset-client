    <use href="#i-tune" x="383" y="131.5" width="19" height="19" color="#8b8b92"/>
    <text x="410" y="145.5" class="t" font-size="13" font-weight="600" fill="#8b8b92">Audio &amp; Video</text>
    <use href="#i-user" x="532" y="131.5" width="19" height="19" color="#8b8b92"/>
    <text x="559" y="145.5" class="t" font-size="13" font-weight="600" fill="#8b8b92">Profile</text>
    <use href="#i-gear" x="633" y="131.5" width="19" height="19" color="#8b8b92"/>
    <text x="660" y="145.5" class="t" font-size="13" font-weight="600" fill="#8b8b92">Settings</text>
    <!-- live line -->
    <circle cx="930" cy="141" r="3.5" fill="#46c07a"/>
    <text x="1166" y="145" class="m" font-size="11" fill="#82828b" text-anchor="end">ping 18 ms · buffer 40 ms · 0.0% loss</text>
    <use href="#i-close" x="1184" y="132" width="18" height="18" color="#c8c8cf"/>

    <!-- rooms column -->
    <rect x="40" y="171" width="240" height="490" fill="#0c0c0e"/>
    <rect x="279" y="171" width="1" height="490" fill="#ffffff" fill-opacity="0.07"/>

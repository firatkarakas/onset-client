    <use href="#i-hash" x="60" y="215" width="18" height="18" color="#ededf0" opacity="0.7"/>
    <text x="87" y="229" class="t" font-size="14" font-weight="600" fill="#ededf0">general</text>
    <use href="#i-hash" x="60" y="253" width="18" height="18" color="#ededf0" opacity="0.7"/>
    <text x="87" y="267" class="t" font-size="14" font-weight="600" fill="#ededf0">design</text>
    <rect x="242" y="253" width="18" height="18" rx="9" fill="#262629"/>
    <text x="251" y="266" class="t" font-size="10.5" font-weight="700" fill="#a0a0a8" text-anchor="middle">2</text>
    <use href="#i-hash" x="60" y="291" width="18" height="18" color="#ededf0" opacity="0.7"/>
